      <rect x="86" y="38" width="428" height="284" rx="18" fill="url(#background)"/>
      <path d="m300 22 17 95 50-83-19 94 78-59-56 81 96-20-85 51 98 18-98 13 83 55-97-23 51 85-76-63 13 97-47-87-26 94-4-98-63 74 34-92-91 35 73-64-98-2 95-28-81-55 99 19-54-82 76 61Z" fill="#ffd47a" opacity=".22"/>
      <circle cx="300" cy="177" r="96" fill="url(#sun)" stroke="#fff1bc" stroke-width="5"/>
      <circle cx="300" cy="177" r="78" fill="none" stroke="#fff9dc" stroke-width="2" opacity=".8"/>
      <text x="300" y="202" fill="#473253" font-family="Georgia, serif" font-size="78" font-weight="700" letter-spacing="-8" text-anchor="middle">30</text>
      <path d="M143 268c87-32 216-32 314 0" fill="none" stroke="#f4d5a2" stroke-width="3" opacity=".9"/>
      <text x="300" y="291" fill="#fff6e2" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4" text-anchor="middle">A LITTLE CELEBRATION</text>
