<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title description">
  <title id="title">Original anniversary-inspired card artwork</title>
  <desc id="description">A colorful, original celebration card with a bright sunburst, number thirty, orbiting stars, and confetti.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#312e58"/>
      <stop offset=".55" stop-color="#59406f"/>
      <stop offset="1" stop-color="#9b4e63"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".45" r=".55">
      <stop offset="0" stop-color="#fff5bf"/>
      <stop offset=".7" stop-color="#ffc86d"/>
      <stop offset="1" stop-color="#f28b62"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#080713" flood-opacity=".45"/>
    </filter>
    <clipPath id="card">
      <rect x="76" y="28" width="448" height="304" rx="24"/>
    </clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="76" y="28" width="448" height="304" rx="24" fill="#f3d996"/>
