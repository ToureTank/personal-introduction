      <path d="m128 174 5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2Z" fill="#ed9d77"/>
      <path d="m470 190 5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2Z" fill="#a8d7e3"/>
